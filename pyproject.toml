[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.setuptools.packages.find]
include = ["wix_monk*"]
where = ["src"]

[project]
authors = [
    {name = "Ludvik Jerabek", email = "83429267+ludvikjerabek@users.noreply.github.com" }
]
name = "wix-monk"
dynamic = ["version"]
readme = "README.md"
description = "Synchronize Wix contacts and memberships to managed Listmonk lists."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pyflakes>=3.4",
    "ruff>=0.15",
    "vulture>=2.16",
]

[project.urls]
repository = "https://github.com/lagomarvb/wix-monk"

[project.scripts]
wix-monk = "wix_monk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
